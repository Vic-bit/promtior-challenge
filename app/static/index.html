<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservas de salas · Cubo Itaú</title>
  <style>
    /* Colors taken from the Cubo logo: black letters, orange square; blue is orange's complement. */
    :root {
      --bg: #d9dde6;        /* page background */
      --surface: #FFFFFF;   /* cards, header, assistant bubbles */
      --field: #ECEDEF;     /* inputs and secondary buttons */
      --text: #111214;      /* the logo's black */
      --muted: #5F6368;
      --accent: #0047BB;    /* details: logged-in user, focus */
      --action: #FF6200;    /* the logo's orange: buttons and the user's own messages */
      --error: #C62828;
      --cut: 10px;          /* size of the diagonal corner cut */
    }

    /* The logo's shape: two opposite corners cut diagonally, no rounded corners anywhere. */
    .chamfer {
      clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)),
                         calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }

    h1 { text-transform: uppercase; font-weight: 800; letter-spacing: 0.06em; }

    button {
      border: none;
      padding: 10px 18px;
      background: var(--action);
      color: var(--text);   /* black on orange reads well; white doesn't */
      font: inherit;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    button.secondary { background: var(--field); color: var(--muted); padding: 6px 12px; font-size: 0.8rem; }

    input {
      width: 100%;
      padding: 10px 12px;
      border: none;
      background: var(--field);
      color: var(--text);
      font: inherit;
    }
    /* clip-path would cut an outline, so focus is an inner blue bar instead. */
    input:focus { outline: none; box-shadow: inset 0 -3px 0 var(--accent); }

    .hidden { display: none !important; }
    .error { color: var(--error); }

    /* Login view */
    #login-view { display: flex; height: 100%; align-items: center; justify-content: center; padding: 16px; }
    #login-form { --cut: 18px; width: 100%; max-width: 360px; background: var(--surface); padding: 32px; display: flex; flex-direction: column; gap: 12px; }
    #login-form h1 { margin: 0 0 8px; font-size: 1.1rem; }
    #login-logo { width: 220px; align-self: center; margin-bottom: 8px; }

    /* Chat view */
    #chat-view { display: flex; flex-direction: column; height: 100%; max-width: 1200px; margin: 0 auto; }
    #main { display: flex; flex: 1; min-height: 0; }
    #chat { display: flex; flex-direction: column; flex: 1; min-width: 0; }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: var(--surface); border-bottom: 3px solid var(--action); }
    header img { height: 24px; }
    header h1 { margin: 0; font-size: 0.9rem; flex: 1; }
    #current-user { color: var(--accent); font-weight: 700; }

    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 80%; padding: 10px 14px; line-height: 1.4; white-space: pre-wrap; }
    .message.assistant { align-self: flex-start; background: var(--surface); }
    .message.user { align-self: flex-end; background: var(--action); color: var(--text); }
    .message.error { align-self: flex-start; background: var(--surface); box-shadow: inset 4px 0 0 var(--error); }
    #typing { color: var(--accent); padding: 0 16px 8px; }

    #chat-form { display: flex; gap: 8px; padding: 12px 16px; background: var(--surface); }

    /* Read-only grid: every room for one day, straight from the database. */
    #schedule { width: 440px; padding: 16px; background: var(--surface); border-left: 3px solid var(--bg); overflow-y: auto; }
    #schedule-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    #schedule-day { font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.9rem; }
    #schedule-nav button { padding: 4px 12px; }
    /* Vertical: time grows downward (y axis), rooms go A to E to the right (x axis). */
    #schedule-grid { display: grid; grid-template-columns: 44px repeat(5, 1fr); gap: 2px; font-size: 0.7rem; }
    .hour { color: var(--muted); align-self: center; }
    .room-label { font-weight: 800; text-align: center; padding-bottom: 4px; }
    .room-label small { display: block; font-weight: 400; color: var(--muted); }
    .slot { height: 22px; display: flex; align-items: center; justify-content: center; }
    .slot.free { background: var(--field); color: var(--muted); }
    .slot.mine { background: var(--action); color: var(--text); font-weight: 700; }
    .slot.taken { background: var(--accent); color: white; font-weight: 700; }
    #schedule-legend { display: flex; gap: 16px; margin-top: 12px; font-size: 0.8rem; color: var(--muted); }
    #schedule-legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -2px; }
    #legend-free::before { background: var(--field); }
    #legend-mine::before { background: var(--action); }
    #legend-taken::before { background: var(--accent); }
    /* A message inside the grid must span every column, or it gets squeezed into the 44px time column. */
    .full-row { grid-column: 1 / -1; color: var(--muted); padding: 8px 0; }

    @media (max-width: 900px) {
      #main { flex-direction: column; }
      #chat { min-height: 60vh; }
      #schedule { width: auto; border-left: none; border-top: 3px solid var(--bg); }
    }
  </style>
</head>
<body>

  <section id="login-view">
    <form id="login-form" class="chamfer">
      <img id="login-logo" src="/static/cubo-logo.svg" alt="Cubo Itaú">
      <h1>Reservas de salas</h1>
      <input id="username" class="chamfer" placeholder="Usuario" autocomplete="username" required>
      <input id="password" class="chamfer" type="password" placeholder="Contraseña" autocomplete="current-password" required>
      <button class="chamfer" type="submit">Ingresar</button>
      <span id="login-error" class="error"></span>
    </form>
  </section>

  <section id="chat-view" class="hidden">
    <header>
      <img src="/static/cubo-logo.svg" alt="Cubo Itaú">
      <h1>Reservas de salas</h1>
      <span id="current-user"></span>
      <button class="secondary chamfer" onclick="newConversation()">Nueva conversación</button>
      <button class="secondary chamfer" onclick="logout()">Salir</button>
    </header>
    <div id="main">
      <div id="chat">
        <div id="messages"></div>
        <div id="typing" class="hidden">El asistente está escribiendo…</div>
        <form id="chat-form">
          <input id="message" class="chamfer" placeholder="Escribí tu mensaje..." autocomplete="off" required>
          <button id="send" class="chamfer" type="submit">Enviar</button>
        </form>
      </div>
      <aside id="schedule">
        <div id="schedule-nav">
          <button class="secondary chamfer" onclick="changeDay(-1)">◀</button>
          <span id="schedule-day"></span>
          <button class="secondary chamfer" onclick="changeDay(1)">▶</button>
        </div>
        <div id="schedule-grid"></div>
        <div id="schedule-legend"><span id="legend-free">Libre</span><span id="legend-mine">Tuyas</span><span id="legend-taken">De otros</span></div>
      </aside>
    </div>
  </section>

  <script>
    // sessionStorage keeps the login while the tab is open, and clears it when the tab closes.
    const session = sessionStorage;

    // Every text the user sees from the script, in one place. The server only sends status codes
    // and English technical errors (for the log); how we talk to the user is decided here.
    const MESSAGES = {
      greeting: (username) =>
        `Hola ${username}, puedo ayudarte a ver qué salas están libres, ` +
        "ver la agenda de una sala, reservar y cancelar tus reservas. ¿Qué necesitás?",
      loginFailed: "Usuario o contraseña inválidos.",
      sessionExpired: "Tu sesión venció. Volvé a ingresar.",
      assistantFailed: "El asistente tuvo un problema y no pudo responder. Probá de nuevo en unos segundos.",
      rateLimited: "El asistente alcanzó su límite de uso por ahora. Probá de nuevo en unos minutos.",
      genericError: "Algo salió mal. Probá de nuevo.",
      noConnection: "No se pudo conectar con el servidor.",
      officeClosed: "La oficina está cerrada este día (abre de lunes a viernes).",
      slotStates: { free: "libre", mine: "tu reserva", taken: "reservada por otro usuario" },
      scheduleFailed: "No se pudo cargar la grilla.",
    };

    function showLogin(message = "") {
      document.getElementById("chat-view").classList.add("hidden");
      document.getElementById("login-view").classList.remove("hidden");
      document.getElementById("login-error").textContent = message;
    }

    function showChat() {
      document.getElementById("login-view").classList.add("hidden");
      document.getElementById("chat-view").classList.remove("hidden");
      document.getElementById("current-user").textContent = "● " + session.getItem("username");
      document.getElementById("message").focus();
      loadSchedule();
    }

    function addMessage(text, kind) {
      const bubble = document.createElement("div");
      bubble.className = "message chamfer " + kind;
      // textContent (never innerHTML): whatever the LLM returns is shown as text, never run as code.
      bubble.textContent = text;
      const messages = document.getElementById("messages");
      messages.appendChild(bubble);
      messages.scrollTop = messages.scrollHeight;
    }

    function greet() {
      addMessage(MESSAGES.greeting(session.getItem("username")), "assistant");
    }

    async function login(event) {
      event.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const response = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      if (!response.ok) {
        showLogin(MESSAGES.loginFailed);
        return;
      }
      const data = await response.json();
      session.setItem("token", data.access_token);
      session.setItem("username", username);
      session.setItem("sessionId", newSessionId());
      showChat();
      greet();
    }

    async function send(event) {
      event.preventDefault();
      const input = document.getElementById("message");
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";
      setWaiting(true);
      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + session.getItem("token"),
          },
          body: JSON.stringify({ message: text, session_id: session.getItem("sessionId") }),
        });
        if (response.status === 401) {
          logout(MESSAGES.sessionExpired);
          return;
        }
        // Check the status before reading JSON: a CloudFront timeout (504) answers with HTML.
        if (!response.ok) {
          addMessage(errorText(response.status), "error");
          return;
        }
        const data = await response.json();
        addMessage(data.reply, "assistant");
        loadSchedule();  // the agent may have just booked or cancelled something
      } catch {
        addMessage(MESSAGES.noConnection, "error");
      } finally {
        setWaiting(false);
      }
    }

    function errorText(status) {
      if (status === 429) {
        return MESSAGES.rateLimited;
      }
      if (status === 503 || status === 504) {
        return MESSAGES.assistantFailed;
      }
      return MESSAGES.genericError;
    }

    function newSessionId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    function setWaiting(waiting) {
      // Disabling the button while waiting avoids sending the same message twice.
      document.getElementById("send").disabled = waiting;
      document.getElementById("typing").classList.toggle("hidden", !waiting);
    }

    function newConversation() {
      // A new session_id means a new thread on the server: the agent starts with no memory.
      session.setItem("sessionId", newSessionId());
      document.getElementById("messages").innerHTML = "";
      greet();
    }

    function logout(message = "") {
      session.clear();
      document.getElementById("messages").innerHTML = "";
      showLogin(message);
    }

    // ---- Schedule grid ----
    const WEEKDAYS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
    let scheduleDay = new Date();  // the day the grid shows; starts today

    function isoDate(day) {
      // YYYY-MM-DD from the browser's local date (toISOString would convert to UTC and may shift the day).
      const pad = (n) => String(n).padStart(2, "0");
      return `${day.getFullYear()}-${pad(day.getMonth() + 1)}-${pad(day.getDate())}`;
    }

    function changeDay(delta) {
      scheduleDay.setDate(scheduleDay.getDate() + delta);
      loadSchedule();
    }

    async function loadSchedule() {
      const day = scheduleDay;
      document.getElementById("schedule-day").textContent =
        `${WEEKDAYS[day.getDay()]} ${String(day.getDate()).padStart(2, "0")}/${String(day.getMonth() + 1).padStart(2, "0")}`;
      const grid = document.getElementById("schedule-grid");
      try {
        const response = await fetch("/schedule?day=" + isoDate(day), {
          headers: { "Authorization": "Bearer " + session.getItem("token") },
        });
        if (response.status === 401) {
          logout(MESSAGES.sessionExpired);
          return;
        }
        renderSchedule(await response.json());
      } catch {
        grid.replaceChildren(cell("full-row", MESSAGES.scheduleFailed));
      }
    }

    function renderSchedule(data) {
      const grid = document.getElementById("schedule-grid");
      grid.innerHTML = "";  // only clears; every cell below is built with createElement
      if (!data.open) {
        grid.appendChild(cell("full-row", MESSAGES.officeClosed));
        return;
      }
      // Header row: an empty corner, then one column per room with its capacity.
      grid.appendChild(cell("", ""));
      for (const room of data.rooms) {
        const label = cell("room-label", room.room);
        const capacity = document.createElement("small");
        capacity.textContent = room.capacity + " pers.";
        label.appendChild(capacity);
        grid.appendChild(label);
      }
      // One row per 30-minute slot: the hour on the axis (only at :00), then each room's cell.
      // Every room has the same slots, so the times come from the first one.
      data.rooms[0].slots.forEach((slot, i) => {
        grid.appendChild(cell("hour", slot.time.endsWith(":00") ? slot.time : ""));
        for (const room of data.rooms) {
          const state = room.slots[i].state;  // "free", "mine" or "taken", decided by the server
          const square = cell("slot " + state, slot.time);
          square.title = `Sala ${room.room} ${slot.time} · ${MESSAGES.slotStates[state]}`;
          grid.appendChild(square);
        }
      });
    }

    function cell(className, text) {
      const div = document.createElement("div");
      div.className = className;
      div.textContent = text;
      return div;
    }

    document.getElementById("login-form").addEventListener("submit", login);
    document.getElementById("chat-form").addEventListener("submit", send);

    // On reload, stay logged in if this tab already has a token.
    if (session.getItem("token")) {
      showChat();
      greet();
    }
  </script>
</body>
</html>
